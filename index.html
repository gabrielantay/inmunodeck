<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>InmunoDeck: Táctica Innata V2</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --border: #334155;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --energy: #fbbf24;
    }
    
    * { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden; /* Evita el scroll global en móviles */
      user-select: none;
    }

    /* --- SISTEMA DE PANTALLAS --- */
    .screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .screen.active { display: flex; }

    /* --- PANTALLA 1: DRAFT (SELECCIÓN) --- */
    #draft-screen {
      padding: 15px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .draft-header { flex-shrink: 0; margin-bottom: 10px; }
    .briefing-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
    }
    /* El contenedor de cartas absorbe el espacio libre y tiene scroll propio */
    .draft-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 10px;
    }
    .draft-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .draft-card {
      background: rgba(0,0,0,0.4);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .draft-card.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      transform: scale(0.98);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    /* Pie de página fijo para el botón (Soluciona el bug en móviles) */
    .draft-footer {
      flex-shrink: 0;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .btn-main {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    .btn-main:disabled { background: #475569; opacity: 0.5; }

    /* --- PANTALLA 2: COMBATE --- */
    #battle-screen {
      position: relative;
      background-size: cover;
      background-position: center;
      transition: background-image 0.5s ease;
    }
    /* Capa de oscurecimiento para mejorar la lectura del texto sobre la foto */
    #battle-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.4) 40%, rgba(15,23,42,0.95) 100%);
      z-index: 1;
    }
    .battle-ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 12px;
    }

    /* Panel Superior: Barras de Vida */
    .status-panel { display: flex; gap: 10px; }
    .status-card {
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 10px;
      border-radius: 8px;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .hp-bar-bg { background: #334155; height: 14px; border-radius: 7px; margin-top: 6px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
    .hp-bar-fill { height: 100%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    #player-bar { background: linear-gradient(90deg, #16a34a, #22c55e); }
    #enemy-bar { background: linear-gradient(90deg, #dc2626, #ef4444); }

    /* Arena Central: Villano y Log */
    .arena-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .enemy-sprite-container {
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, transparent 70%);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      margin-bottom: 20px;
    }
    .enemy-sprite {
      font-size: 80px;
      filter: drop-shadow(0 0 15px var(--danger));
      transition: transform 0.2s;
    }
    .combat-log {
      background: var(--panel-bg);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      min-height: 45px;
      max-width: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Panel Inferior: Cartas y Controles */
    .battle-controls { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .energy-display { font-size: 18px; font-weight: bold; color: var(--energy); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .btn-turn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
    
    .hand-container {
      display: flex; gap: 8px; width: 100%;
    }
    .battle-card {
      flex: 1;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #475569;
      border-radius: 8px;
      padding: 8px 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
    }
    .battle-card.disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
    .battle-card:active:not(.disabled) { transform: scale(0.92); }
    
    .c-cost { position: absolute; top: -6px; right: -6px; background: var(--energy); color: #000; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; border: 2px solid #000; }
    .c-icon { font-size: 28px; margin: 4px 0; }
    .c-name { font-size: 11px; font-weight: bold; text-align: center; line-height: 1.1; }
    .c-desc { font-size: 9px; color: #94a3b8; text-align: center; margin-top: 4px; line-height: 1.1; display: none; } /* Oculto en batalla móvil para ahorrar espacio */

    /* --- ANIMACIONES CSS --- */
    .anim-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    .anim-damage-screen { animation: flashRed 0.5s ease-out; }
    .anim-attack-enemy { animation: enemyLunge 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
    
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }
    @keyframes flashRed {
      0% { box-shadow: inset 0 0 0 0 transparent; }
      50% { box-shadow: inset 0 0 100px 20px rgba(239, 68, 68, 0.7); }
      100% { box-shadow: inset 0 0 0 0 transparent; }
    }
    @keyframes enemyLunge {
      0% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.3) translateY(40px); }
      100% { transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: DRAFT -->
  <div id="draft-screen" class="screen active">
    <div class="draft-header">
      <div class="briefing-box">
        <h3 id="br-title" style="color: var(--accent); margin-bottom: 4px; font-size: 16px;">Analizando Infección...</h3>
        <p id="br-desc" style="font-size: 12px; color: #cbd5e1; line-height: 1.4;"></p>
      </div>
    </div>
    
    <div style="font-size: 13px; margin-bottom: 8px; font-weight: bold;">Configura tu barrera (Selecciona <span id="draft-count">0</span>/4):</div>
    
    <div class="draft-content">
      <div class="draft-grid" id="draft-grid"></div>
    </div>
    
    <div class="draft-footer">
      <button id="btn-start" class="btn-main" disabled onclick="initBattle()">Desplegar Defensas</button>
    </div>
  </div>

  <!-- PANTALLA 2: COMBATE -->
  <div id="battle-screen" class="screen">
    <div id="battle-overlay"></div>
    
    <div class="battle-ui">
      
      <!-- ESTADO -->
      <div class="status-panel">
        <div class="status-card">
          <div style="font-size: 11px; color:#cbd5e1;">🛡️ Integridad Tisular</div>
          <div class="hp-bar-bg"><div id="player-bar" class="hp-bar-fill" style="width: 100%;"></div></div>
          <div id="player-hp-txt" style="font-size: 12px; font-weight:bold; margin-top: 4px;">100 / 100</div>
        </div>
        <div class="status-card">
          <div id="enemy-name" style="font-size: 11px; color:#cbd5e1; text-align:right;">Patógeno</div>
          <div class="hp-bar-bg"><div id="enemy-bar" class="hp-bar-fill" style="width: 100%;"></div></div>
          <div id="enemy-hp-txt" style="font-size: 12px; font-weight:bold; margin-top: 4px; text-align:right;">100 / 100</div>
        </div>
      </div>

      <!-- ARENA -->
      <div class="arena-center">
        <div class="enemy-sprite-container">
          <div id="enemy-sprite" class="enemy-sprite">🧫</div>
        </div>
        <div id="combat-log" class="combat-log">Las células fagocíticas están en posición. Tu turno.</div>
      </div>

      <!-- CONTROLES Y MANO -->
      <div>
        <div class="battle-controls">
          <div class="energy-display">ATP: <span id="energy-val">3</span>/3</div>
          <button id="btn-end-turn" class="btn-turn" onclick="executeEnemyTurn()">Terminar Turno</button>
        </div>
        <div class="hand-container" id="battle-hand"></div>
      </div>
      
    </div>
  </div>

  <script>
    /* --- BASE DE DATOS TEÓRICA --- */
    const SCENARIOS = [
      {
        id: 'piel',
        name: 'Epidermis Subcutánea',
        bg: 'https://images.unsplash.com/photo-1579548122080-c35fd6820ecb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
        enemy: 'Staphylococcus aureus',
        type: 'bacteria',
        icon: '🦠',
        hp: 120,
        atk: 15,
        desc: 'Laceración cutánea detectada. Biopelícula Gram (+) formándose. Alta susceptibilidad a fagocitosis directa (Neutrófilos) y formación de MAC (Complemento).'
      },
      {
        id: 'mucosa',
        name: 'Epitelio Respiratorio',
        bg: 'https://images.unsplash.com/photo-1583912265924-a8eda0e2817f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
        enemy: 'Orthomyxovirus (Influenza)',
        type: 'virus',
        icon: '🪡',
        hp: 90,
        atk: 22,
        desc: 'Invasión intracelular masiva. Los virus evaden fagocitos comunes. Requiere inducción de apoptosis celular (Células NK) y estado antiviral (Interferón).'
      },
      {
        id: 'galt',
        name: 'Mucosa Intestinal (GALT)',
        bg: 'https://images.unsplash.com/photo-1614210600109-f3162fb16709?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
        enemy: 'Ascaris lumbricoides',
        type: 'helminto',
        icon: '🪱',
        hp: 150,
        atk: 18,
        desc: 'Parásito metazoario. Su gran tamaño bloquea la fagocitosis. Depende estrictamente de la desgranulación extracelular (Eosinófilos).'
      }
    ];

    const CARDS = [
      { id: 'neutro', name: 'Neutrófilo', cost: 1, type: 'atk', val: 25, icon: '💥', desc: 'Fagocita (-25HP). Inútil vs Helmintos.' },
      { id: 'macro', name: 'Macrófago', cost: 2, type: 'atk_heal', val: 15, heal: 20, icon: '🧹', desc: 'Fagocita (-15HP) y repara tejido (+20HP).' },
      { id: 'nk', name: 'Célula NK', cost: 2, type: 'atk', val: 35, icon: '🎯', desc: 'Apoptosis inducida (-35HP). Letal vs Virus.' },
      { id: 'eosino', name: 'Eosinófilo', cost: 2, type: 'atk', val: 15, icon: '🧪', desc: 'Desgranulación tóxica. Daño x3 a Helmintos.' },
      { id: 'comp', name: 'Complemento', cost: 1, type: 'buff', icon: '🍩', desc: 'Complejo MAC: Próximo daño +50%.' },
      { id: 'ifn', name: 'Interferón', cost: 1, type: 'shield', icon: '🛡️', desc: 'Reduce daño viral enemigo a la mitad 1 turno.' }
    ];

    /* --- ESTADO DEL JUEGO --- */
    let currentScen = null;
    let deck = [];
    let playerHp = 100, enemyHp = 100, maxEnemyHp = 100;
    let atp = 3;
    let isEnemyTurn = false;
    let buffOpsonized = false;
    let buffShield = false;

    /* --- SISTEMA UI GENERAL --- */
    const UI = {
      log: (msg) => document.getElementById('combat-log').innerHTML = msg,
      updateBars: () => {
        document.getElementById('player-bar').style.width = `${Math.max(0, playerHp)}%`;
        document.getElementById('player-hp-txt').innerText = `${Math.max(0, playerHp)} / 100`;
        const ePct = Math.max(0, (enemyHp/maxEnemyHp)*100);
        document.getElementById('enemy-bar').style.width = `${ePct}%`;
        document.getElementById('enemy-hp-txt').innerText = `${Math.max(0, enemyHp)} / ${maxEnemyHp}`;
        document.getElementById('energy-val').innerText = atp;
        renderBattleHand(); // Actualiza disponibilidad visual de cartas según ATP
      }
    };

    /* --- FASE 1: INICIO Y DRAFT --- */
    function initDraft() {
      currentScen = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
      document.getElementById('br-title').innerText = `Zona de Infección: ${currentScen.name}`;
      document.getElementById('br-desc').innerText = currentScen.desc;
      
      const grid = document.getElementById('draft-grid');
      grid.innerHTML = '';
      deck = [];
      
      CARDS.forEach(c => {
        const div = document.createElement('div');
        div.className = 'draft-card';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <strong style="font-size:13px;">${c.name}</strong>
            <span style="color:var(--energy); font-weight:bold; font-size:12px;">${c.cost} ATP</span>
          </div>
          <div style="font-size:26px; text-align:center;">${c.icon}</div>
          <div style="font-size:10px; color:#94a3b8; margin-top:4px;">${c.desc}</div>
        `;
        div.onclick = () => {
          const idx = deck.indexOf(c);
          if (idx > -1) { deck.splice(idx, 1); div.classList.remove('selected'); }
          else if (deck.length < 4) { deck.push(c); div.classList.add('selected'); }
          
          document.getElementById('draft-count').innerText = deck.length;
          document.getElementById('btn-start').disabled = deck.length !== 4;
        };
        grid.appendChild(div);
      });
    }

    /* --- FASE 2: COMBATE --- */
    function initBattle() {
      document.getElementById('draft-screen').classList.remove('active');
      document.getElementById('battle-screen').classList.add('active');
      
      // Aplicar Fondo
      document.getElementById('battle-screen').style.backgroundImage = `url('${currentScen.bg}')`;
      
      // Configurar Enemigo
      enemyHp = maxEnemyHp = currentScen.hp;
      document.getElementById('enemy-name').innerText = currentScen.enemy;
      document.getElementById('enemy-sprite').innerText = currentScen.icon;
      
      UI.updateBars();
    }

    function renderBattleHand() {
      const hand = document.getElementById('battle-hand');
      hand.innerHTML = '';
      deck.forEach(c => {
        const div = document.createElement('div');
        div.className = `battle-card ${atp < c.cost || isEnemyTurn ? 'disabled' : ''}`;
        div.innerHTML = `
          <div class="c-cost">${c.cost}</div>
          <div class="c-icon">${c.icon}</div>
          <div class="c-name">${c.name}</div>
        `;
        div.onclick = () => playCard(c);
        hand.appendChild(div);
      });
    }

    /* --- MECÁNICA: JUGADOR JUEGA CARTA --- */
    function playCard(c) {
      if (isEnemyTurn || atp < c.cost || enemyHp <= 0 || playerHp <= 0) return;
      
      atp -= c.cost;
      let msg = "";
      
      // Lógica de daño biológico y afinidades
      if (c.type.includes('atk')) {
        let dmg = c.val;
        
        if (c.id === 'eosino' && currentScen.type === 'helminto') dmg *= 3;
        else if (c.id === 'nk' && currentScen.type === 'virus') dmg *= 2;
        else if (c.id === 'neutro' && currentScen.type === 'helminto') dmg = 5; // Fracaso de fagocitosis

        if (buffOpsonized) { dmg = Math.floor(dmg * 1.5); buffOpsonized = false; }
        
        enemyHp -= dmg;
        animateEnemyHit();
        msg = `¡${c.name} infunde <strong>-${dmg} HP</strong> al patógeno!`;
        
        if (c.heal) {
          playerHp = Math.min(100, playerHp + c.heal);
          msg += ` Reparación tisular (+${c.heal} HP).`;
        }
      } else if (c.type === 'buff') {
        buffOpsonized = true;
        msg = `El sistema de Complemento opsoniza al objetivo. Daño futuro amplificado.`;
      } else if (c.type === 'shield') {
        buffShield = true;
        msg = `Interferón secretado. Tejido adyacente protegido temporalmente.`;
      }

      UI.log(msg);
      UI.updateBars();
      
      if (enemyHp <= 0) {
        setTimeout(() => UI.log("🏆 <strong>Infección Errradicada.</strong> Integridad del hospedero asegurada."), 500);
      }
    }

    /* --- MECÁNICA: TURNO DEL ENEMIGO --- */
    function executeEnemyTurn() {
      if (isEnemyTurn || enemyHp <= 0 || playerHp <= 0) return;
      
      isEnemyTurn = true;
      UI.updateBars(); // Deshabilita cartas visualmente
      UI.log(`Turno del Patógeno... <strong>${currentScen.enemy}</strong> sintetiza factores de virulencia.`);
      
      setTimeout(() => {
        let eDmg = currentScen.atk;
        if (buffShield) {
          eDmg = Math.floor(eDmg / 2);
          buffShield = false;
        }
        
        // Animación Enemiga
        const sprite = document.getElementById('enemy-sprite');
        sprite.classList.add('anim-attack-enemy');
        
        setTimeout(() => {
          playerHp -= eDmg;
          document.body.classList.add('anim-damage-screen');
          UI.log(`🚨 ¡El patógeno destruye tejido celular! (<strong>-${eDmg} HP</strong>)`);
          UI.updateBars();
          
          if (playerHp <= 0) {
            UI.log("💀 <strong>Choque séptico.</strong> Falla de la barrera inmunológica.");
            return;
          }
          
          // Restauración de Turno del Jugador
          setTimeout(() => {
            sprite.classList.remove('anim-attack-enemy');
            document.body.classList.remove('anim-damage-screen');
            atp = 3;
            isEnemyTurn = false;
            UI.log("Fase de reconocimiento. ATP restaurado. Despliega tus defensas.");
            UI.updateBars();
          }, 1500);
          
        }, 250); // Sincronizado con el pico de la animación de ataque
        
      }, 1500); // Pausa dramática de lectura antes de atacar
    }

    // Funciones de Animación DOM
    function animateEnemyHit() {
      const sp = document.getElementById('enemy-sprite');
      sp.classList.remove('anim-shake');
      void sp.offsetWidth; // Reflow forzado
      sp.classList.add('anim-shake');
    }

    // Inicializar el juego al cargar la página
    window.onload = initDraft;
  </script>
</body>
</html>

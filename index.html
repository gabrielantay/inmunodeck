<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>InmunoDeck: Defensa Innata</title>
  <style>
    :root {
      --bg-dark: #050b14;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --energy: #fbbf24;
      --panel: rgba(15, 23, 42, 0.85);
      --border: #334155;
    }
    
    * { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: #000;
      color: white;
      /* Uso de dvh para asegurar que el iPad no corte el contenido */
      height: 100dvh; 
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
    }

    /* --- SISTEMA DE TRANSICIÓN FLUIDA ENTRE PANTALLAS --- */
    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
      background-size: cover;
      background-position: center;
    }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- PANTALLA 1: DRAFT --- */
    #draft-screen {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .draft-header {
      flex: 0 0 auto;
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border-bottom: 2px solid var(--border);
    }
    .draft-title { font-size: 28px; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
    
    /* Contenedor flexible con scroll interno para iPad/Móvil */
    .draft-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px;
    }
    .draft-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }
    
    .draft-footer {
      flex: 0 0 auto;
      padding: 15px 20px max(20px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid var(--border);
      box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
    }

    /* Cartas con Imágenes Biológicas */
    .card-bio {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      aspect-ratio: 3 / 4;
    }
    .card-bio.selected { border-color: var(--success); box-shadow: 0 0 15px rgba(34, 197, 94, 0.6); transform: translateY(-4px); }
    .card-bio.disabled { filter: grayscale(1) brightness(0.5); pointer-events: none; }
    .card-bio:active:not(.disabled) { transform: scale(0.95); }
    
    .c-img {
      flex: 1;
      background-size: cover;
      background-position: center;
      position: relative;
      border-bottom: 2px solid #334155;
    }
    .c-cost {
      position: absolute; top: 5px; right: 5px;
      background: var(--energy); color: #000;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-weight: 900; font-size: 16px; border: 2px solid #000;
    }
    .c-info {
      background: #0f172a; padding: 8px 5px; text-align: center;
    }
    .c-name { font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
    .c-desc { font-size: 10px; color: #94a3b8; line-height: 1.2; }

    .btn-main {
      width: 100%; background: var(--success); color: white; border: none; padding: 18px;
      border-radius: 12px; font-weight: 900; font-size: 20px; text-transform: uppercase;
      transition: background 0.2s;
    }
    .btn-main:disabled { background: #475569; opacity: 0.5; }

    /* --- PANTALLA 2: COMBATE --- */
    #battle-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 1;
    }
    .battle-ui { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
    
    .hud-top { flex: 0 0 auto; padding: 15px max(15px, env(safe-area-inset-left)); }
    .env-title { font-size: 32px; font-weight: 900; text-align: center; color: var(--accent); text-shadow: 2px 2px 4px #000; text-transform: uppercase; margin-bottom: 10px; }
    
    .bars-container { display: flex; justify-content: space-between; gap: 15px; }
    .bar-wrapper { flex: 1; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
    .bar-label { font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
    .bar-bg { background: #1e293b; height: 24px; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid #000; }
    .bar-fill { height: 100%; transition: width 0.4s ease-out; }
    #player-bar { background: var(--success); }
    #enemy-bar { background: var(--danger); }
    .bar-text { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: 900; text-shadow: 1px 1px 2px #000; }

    /* Arena Central */
    .arena { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; position: relative; }
    .enemy-avatar {
      width: 220px; height: 220px;
      border-radius: 50%;
      background-size: cover; background-position: center;
      border: 4px solid var(--danger);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.5);
      animation: breathe 4s ease-in-out infinite;
      position: relative;
    }
    
    /* HUD Inferior */
    .hud-bottom {
      flex: 0 0 auto;
      background: rgba(0,0,0,0.8);
      padding: 15px 15px max(15px, env(safe-area-inset-bottom));
      border-top: 2px solid var(--border);
    }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .energy-display { font-size: 24px; font-weight: 900; color: var(--energy); display: flex; align-items: center; gap: 8px; }
    .btn-turn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 900; font-size: 16px; text-transform: uppercase; }
    .hand-container { display: flex; gap: 10px; justify-content: center; height: 180px; }

    /* --- ANIMACIONES Y ESTADOS --- */
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    
    .turn-announcer {
      position: absolute; top: 40%; left: -100vw; width: 100vw;
      background: rgba(220, 38, 38, 0.9); padding: 20px 0;
      text-align: center; font-size: 36px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .turn-announcer.show { transform: translateX(0); }
    .turn-announcer.hide { transform: translateX(100vw); }

    .fct {
      position: absolute; z-index: 50; font-size: 45px; font-weight: 900; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
      pointer-events: none; animation: floatUp 1.2s ease-out forwards;
    }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 20% { transform: translateY(-40px) scale(1.2); } 100% { opacity: 0; transform: translateY(-100px) scale(1); } }

    .shake { animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim { 10%, 90% { transform: translate3d(-6px, 0, 0); } 20%, 80% { transform: translate3d(10px, 0, 0); filter: brightness(2) saturate(3); } 30%, 50%, 70% { transform: translate3d(-14px, 0, 0); } 40%, 60% { transform: translate3d(14px, 0, 0); } }

    /* Pantallas de Fin de Juego */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-title { font-size: 50px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; text-shadow: 0 0 20px currentColor; }
    .modal-desc { font-size: 18px; color: #cbd5e1; text-align: center; max-width: 80%; line-height: 1.5; margin-bottom: 30px; }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- PANTALLA 1: DRAFT -->
    <div id="draft-screen" class="screen active">
      <div class="draft-header">
        <div class="draft-title" id="draft-tissue-name">ANALIZANDO TEJIDO...</div>
        <div style="font-size: 15px; color: #94a3b8; margin-top: 5px;">Ensambla tu respuesta inmune (<span id="draft-count">0</span>/4)</div>
      </div>
      <div class="draft-body">
        <div class="draft-grid" id="draft-grid"></div>
      </div>
      <div class="draft-footer">
        <button id="btn-start" class="btn-main" disabled onclick="transitionToBattle()">INICIAR RESPUESTA INMUNE</button>
      </div>
    </div>

    <!-- PANTALLA 2: COMBATE -->
    <div id="battle-screen" class="screen">
      <div id="battle-overlay"></div>
      <div class="battle-ui">
        
        <div class="hud-top">
          <div class="env-title" id="env-title">Epidermis</div>
          <div class="bars-container">
            <div class="bar-wrapper">
              <div class="bar-label" style="color: var(--success);">Integridad Tisular</div>
              <div class="bar-bg">
                <div id="player-bar" class="bar-fill"></div>
                <div id="player-hp-txt" class="bar-text">100/100</div>
              </div>
            </div>
            <div class="bar-wrapper">
              <div class="bar-label" id="enemy-name" style="color: var(--danger); text-align: right;">Patógeno</div>
              <div class="bar-bg" style="display: flex; justify-content: flex-end;">
                <div id="enemy-bar" class="bar-fill"></div>
                <div id="enemy-hp-txt" class="bar-text">100/100</div>
              </div>
            </div>
          </div>
        </div>

        <div class="arena" id="arena">
          <div id="enemy-avatar" class="enemy-avatar"></div>
        </div>

        <div class="hud-bottom">
          <div class="controls">
            <div class="energy-display">ATP: <span id="energy-val">3</span></div>
            <button id="btn-end-turn" class="btn-turn" onclick="startEnemyTurn()">Fin de Turno</button>
          </div>
          <div class="hand-container" id="battle-hand"></div>
        </div>
      </div>
    </div>

    <!-- ANIMADOR DE TURNOS -->
    <div id="turn-announcer" class="turn-announcer">TURNO DEL PATÓGENO</div>

    <!-- PANTALLAS FINALIZACIÓN -->
    <div id="end-modal" class="modal-overlay">
      <div id="end-title" class="modal-title"></div>
      <div id="end-desc" class="modal-desc"></div>
      <button class="btn-turn" style="padding: 15px 30px; font-size: 20px;" onclick="location.reload()">NUEVA INFECCIÓN</button>
    </div>

  </div>

  <script>
    /* 
      BASE DE DATOS DE IMÁGENES BIOLÓGICAS (Puedes reemplazar las URLs por "./img/tu_archivo.jpg")
      Se usan recursos representativos de alta calidad de microscopía y biología abstracta.
    */
    const IMG = {
      neutrofilo: 'https://images.unsplash.com/photo-1579303914800-474cbdb54784?auto=format&fit=crop&w=400&q=80',
      macrofago: 'https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=400&q=80',
      nk: 'https://images.unsplash.com/photo-1614947936181-422f254f1647?auto=format&fit=crop&w=400&q=80',
      eosinofilo: 'https://images.unsplash.com/photo-1583912265924-a8eda0e2817f?auto=format&fit=crop&w=400&q=80',
      complemento: 'https://images.unsplash.com/photo-1618055627685-61019d08e505?auto=format&fit=crop&w=400&q=80',
      interferon: 'https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&w=400&q=80',
      
      bgPiel: 'https://images.unsplash.com/photo-1612441804231-77a36b284856?auto=format&fit=crop&w=1200&q=80',
      bgMucosa: 'https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?auto=format&fit=crop&w=1200&q=80',
      bgGalt: 'https://images.unsplash.com/photo-1559523161-0fc0d8b38a7a?auto=format&fit=crop&w=1200&q=80',
      
      pathoBact: 'https://images.unsplash.com/photo-1628527304948-0615f3e9ea7a?auto=format&fit=crop&w=400&q=80',
      pathoVirus: 'https://images.unsplash.com/photo-1583324113626-70df0f4deaab?auto=format&fit=crop&w=400&q=80',
      pathoHelm: 'https://images.unsplash.com/photo-1518349619113-03114f06124a?auto=format&fit=crop&w=400&q=80'
    };

    const SCENARIOS = [
      { id: 'piel', name: 'Epidermis Subcutánea', enemy: 'Staphylococcus aureus', type: 'bacteria', hp: 120, atk: 18, bg: IMG.bgPiel, avatar: IMG.pathoBact },
      { id: 'mucosa', name: 'Epitelio Respiratorio', enemy: 'Orthomyxovirus', type: 'virus', hp: 90, atk: 25, bg: IMG.bgMucosa, avatar: IMG.pathoVirus },
      { id: 'galt', name: 'GALT Intestinal', enemy: 'Ascaris lumbricoides', type: 'helminto', hp: 160, atk: 15, bg: IMG.bgGalt, avatar: IMG.pathoHelm }
    ];

    const CARDS = [
      { id: 'neutro', name: 'Neutrófilo', cost: 1, type: 'atk', val: 30, img: IMG.neutrofilo, desc: 'Fagocitosis directa. Falla contra macroparásitos.' },
      { id: 'macro', name: 'Macrófago', cost: 2, type: 'atk_heal', val: 20, heal: 15, img: IMG.macrofago, desc: 'Fagocitosis y reparación de daño tisular.' },
      { id: 'nk', name: 'Célula NK', cost: 2, type: 'atk', val: 40, img: IMG.nk, desc: 'Apoptosis vía perforinas. Letal vs Virus intracelulares.' },
      { id: 'eosino', name: 'Eosinófilo', cost: 2, type: 'atk', val: 25, img: IMG.eosinofilo, desc: 'Desgranulación de Proteína Básica Mayor.' },
      { id: 'comp', name: 'Complemento', cost: 1, type: 'buff', img: IMG.complemento, desc: 'Opsonización (C3b). +50% al siguiente ataque.' },
      { id: 'ifn', name: 'Interferón α/β', cost: 1, type: 'shield', img: IMG.interferon, desc: 'Estado antiviral: divide a la mitad el ataque enemigo.' }
    ];

    let currentScen = null;
    let deck = [];
    let playerHp = 100, enemyHp = 100, maxEnemyHp = 100;
    let atp = 3;
    let turnState = 'PLAYER'; // PLAYER, ENEMY, GAMEOVER
    let opsonized = false, shielded = false;

    /* --- INICIALIZACIÓN --- */
    function initApp() {
      currentScen = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
      document.getElementById('draft-tissue-name').innerText = currentScen.name;
      
      const grid = document.getElementById('draft-grid');
      CARDS.forEach(c => {
        const el = document.createElement('div');
        el.className = 'card-bio';
        el.innerHTML = `
          <div class="c-img" style="background-image: url('${c.img}')"></div>
          <div class="c-cost">${c.cost}</div>
          <div class="c-info">
            <div class="c-name">${c.name}</div>
            <div class="c-desc">${c.desc}</div>
          </div>
        `;
        el.onclick = () => toggleSelection(c, el);
        grid.appendChild(el);
      });
    }

    function toggleSelection(cardObj, element) {
      const idx = deck.indexOf(cardObj);
      if (idx > -1) {
        deck.splice(idx, 1);
        element.classList.remove('selected');
      } else {
        if (deck.length < 4) {
          deck.push(cardObj);
          element.classList.add('selected');
        }
      }
      document.getElementById('draft-count').innerText = deck.length;
      document.getElementById('btn-start').disabled = deck.length !== 4;
    }

    function transitionToBattle() {
      document.getElementById('draft-screen').classList.remove('active');
      const battleScreen = document.getElementById('battle-screen');
      battleScreen.style.backgroundImage = `url('${currentScen.bg}')`;
      battleScreen.classList.add('active');
      
      document.getElementById('env-title').innerText = currentScen.name;
      document.getElementById('enemy-name').innerText = currentScen.enemy;
      document.getElementById('enemy-avatar').style.backgroundImage = `url('${currentScen.avatar}')`;
      
      enemyHp = maxEnemyHp = currentScen.hp;
      updateBattleUI();
    }

    /* --- LÓGICA DE COMBATE Y RENDERIZADO VISUAL --- */
    function updateBattleUI() {
      document.getElementById('player-bar').style.width = `${Math.max(0, playerHp)}%`;
      document.getElementById('player-hp-txt').innerText = `${Math.max(0, playerHp)} / 100`;
      
      const ePct = Math.max(0, (enemyHp / maxEnemyHp) * 100);
      document.getElementById('enemy-bar').style.width = `${ePct}%`;
      document.getElementById('enemy-hp-txt').innerText = `${Math.max(0, enemyHp)} / ${maxEnemyHp}`;
      
      document.getElementById('energy-val').innerText = atp;
      
      const hand = document.getElementById('battle-hand');
      hand.innerHTML = '';
      deck.forEach(c => {
        const el = document.createElement('div');
        const isDisabled = turnState !== 'PLAYER' || atp < c.cost;
        el.className = `card-bio ${isDisabled ? 'disabled' : ''}`;
        el.style.width = '120px';
        el.innerHTML = `
          <div class="c-img" style="background-image: url('${c.img}')"></div>
          <div class="c-cost">${c.cost}</div>
          <div class="c-info"><div class="c-name" style="font-size:11px;">${c.name}</div></div>
        `;
        el.onclick = (e) => executePlayerAction(c, el, e);
        hand.appendChild(el);
      });
    }

    function executePlayerAction(card, cardElement, event) {
      if (turnState !== 'PLAYER' || atp < card.cost) return;
      
      atp -= card.cost;
      updateBattleUI();

      const enemyAvatar = document.getElementById('enemy-avatar');
      const eRect = enemyAvatar.getBoundingClientRect();
      const cX = eRect.left + (eRect.width / 2);
      const cY = eRect.top + (eRect.height / 2);

      // Resolución Biológica
      if (card.type.includes('atk')) {
        let dmg = card.val;
        
        // Reglas estrictas de biología
        if (card.id === 'eosino' && currentScen.type === 'helminto') dmg *= 3;
        else if (card.id === 'nk' && currentScen.type === 'virus') dmg *= 2;
        else if (card.id === 'neutro' && currentScen.type === 'helminto') dmg = 5; // Macroparásito evade fagocitosis

        if (opsonized) { dmg = Math.floor(dmg * 1.5); opsonized = false; }
        
        enemyHp -= dmg;
        spawnText(`-${dmg}`, '#ef4444', cX, cY);
        triggerShake(enemyAvatar);

        if (card.heal) {
          playerHp = Math.min(100, playerHp + card.heal);
          spawnText(`+${card.heal}`, '#22c55e', cX, cY + 40);
        }
      } 
      else if (card.type === 'buff') {
        opsonized = true;
        spawnText("C3b: OPSONIZADO", '#a855f7', cX, cY);
      } 
      else if (card.type === 'shield') {
        shielded = true;
        spawnText("IFN: ANTIVIRAL", '#38bdf8', cX, cY);
      }

      updateBattleUI();

      if (enemyHp <= 0) {
        endGame('VICTORIA INMUNOLÓGICA', 'Las barreras innatas neutralizaron la amenaza antes de requerir linfocitos adaptativos.', '#22c55e');
      } else if (atp === 0) {
        setTimeout(startEnemyTurn, 800);
      }
    }

    function startEnemyTurn() {
      if (turnState !== 'PLAYER' || enemyHp <= 0) return;
      turnState = 'ENEMY';
      updateBattleUI();

      // Animación de cartel
      const announcer = document.getElementById('turn-announcer');
      announcer.innerText = "TURNO DEL PATÓGENO";
      announcer.style.background = "rgba(220, 38, 38, 0.9)";
      announcer.classList.remove('hide');
      announcer.classList.add('show');
      
      setTimeout(() => {
        announcer.classList.remove('show');
        announcer.classList.add('hide');
        
        // Embestida
        const avatar = document.getElementById('enemy-avatar');
        avatar.style.transform = "scale(1.4) translateY(40px)";
        
        setTimeout(() => {
          let eDmg = currentScen.atk;
          if (shielded) { eDmg = Math.floor(eDmg / 2); shielded = false; }
          
          playerHp -= eDmg;
          
          const pRect = document.getElementById('player-bar').getBoundingClientRect();
          spawnText(`-${eDmg}`, '#ef4444', pRect.left + (pRect.width/2), pRect.top - 20);
          
          // Flash rojo en pantalla
          const overlay = document.getElementById('battle-overlay');
          overlay.style.background = "linear-gradient(to bottom, rgba(239, 68, 68, 0.4) 0%, rgba(220, 38, 38, 0.9) 100%)";
          setTimeout(() => overlay.style.background = "linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%)", 300);

          avatar.style.transform = "scale(1) translateY(0)";
          updateBattleUI();

          if (playerHp <= 0) {
            endGame('INFECCIÓN SISTÉMICA', 'La barrera epitelial fue destruida. El patógeno ingresó al torrente sanguíneo. Derrota celular.', '#ef4444');
          } else {
            setTimeout(resetPlayerTurn, 1000);
          }
        }, 300);
      }, 1500);
    }

    function resetPlayerTurn() {
      if (turnState === 'GAMEOVER') return;
      
      const announcer = document.getElementById('turn-announcer');
      announcer.innerText = "TU TURNO";
      announcer.style.background = "rgba(34, 197, 94, 0.9)";
      announcer.classList.remove('hide');
      announcer.classList.add('show');
      
      setTimeout(() => {
        announcer.classList.remove('show');
        announcer.classList.add('hide');
        atp = 3;
        turnState = 'PLAYER';
        updateBattleUI();
      }, 1200);
    }

    function endGame(title, desc, color) {
      turnState = 'GAMEOVER';
      setTimeout(() => {
        const modal = document.getElementById('end-modal');
        document.getElementById('end-title').innerText = title;
        document.getElementById('end-title').style.color = color;
        document.getElementById('end-desc').innerText = desc;
        modal.classList.add('active');
      }, 800);
    }

    function spawnText(txt, color, x, y) {
      const el = document.createElement('div');
      el.className = 'fct';
      el.style.color = color;
      el.innerText = txt;
      // Centrar respecto a coordenadas
      el.style.left = `${x - 20}px`;
      el.style.top = `${y - 20}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    function triggerShake(element) {
      element.classList.remove('shake');
      void element.offsetWidth;
      element.classList.add('shake');
    }

    // Iniciar
    window.onload = initApp;
  </script>
</body>
</html>
